[package]
name = "digital-dukaan"
version = "0.1.0"
description = "Digital Dukaan - Complete Business Management System"
authors = ["Digital Dukaan"]
edition = "2021"

[lib]
name = "digital_dukaan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

chrono = "0.4"
dirs = "5.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }

rusqlite = { version = "0.37", features = ["bundled"] }
once_cell = "1.21"

# Release profile optimizations
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
